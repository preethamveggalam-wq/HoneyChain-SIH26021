async function geocodeCustomerAddress(batchId){

    const raw=String(batch.customerAddress).trim();
    const addressLower=raw.toLowerCase();

    // Koti is a known Hyderabad locality; lock it to the locality coordinates
    // instead of allowing a global geocoder to choose another place named Koti.
    if(/\bkoti\b/.test(addressLower) && /\bhyderabad\b/.test(addressLower)){
      const lat=17.38564, lng=78.48371;

      state.batches[key]=batch; write(BKEY,state.batches);
      const feed=state.tracking.batchFeeds[key];
      if(feed){feed.customerLat=lat;feed.customerLng=lng;}
      return {lat,lng,displayName:batch.customerResolvedAddress};
    }

    let query=raw;
    if(!/\btelangana\b/i.test(query) && /\bhyderabad\b/i.test(query)) query += ", Telangana";
    if(!/\bindia\b/i.test(query)) query += ", India";

    const params=new URLSearchParams({format:"jsonv2",limit:"5",addressdetails:"1",

      params.set("bounded","1");

    if(!response.ok) throw new Error(`Geocoding request failed (${response.status})`);

 const selected=o.selectedBatchId&&candidates.some(b=>b.batchId===o.selectedBatchId)?o.selectedBatchId:candidates[0].batchId;
 const batch=state.batches[selected];
 if(!batch||normalizeHoneyName(batch.honeyType)!==normalizeHoneyName(o.honeyType)||batchStockKg(batch)<requestedKg){state.batchMsg="Select a matching batch with enough stock.";render();return}
 const originalStockKg=batchStockKg(batch);
 const dispatched={...batch,batchId:batch.batchId,quantity:requestedKg,customerName:o.customerName,customerPhone:o.customerPhone,countryCode:o.countryCode,customerAddress:o.customerAddress,totalAmount:o.totalAmount,orderId:o.orderId,invoiceNumber:o.invoiceNumber,paymentStatus:o.paymentStatus,orderQuantityLabel:o.quantityLabel,originalBatchQuantity:originalStockKg};

 batch.quantity=Math.max(0,originalStockKg-requestedKg);batch.quantityKg=batch.quantity;batch.lastDispatchOrderId=o.orderId;
 state.batches[batch.batchId]=batch;write(BKEY,state.batches);write(OKEY,state.orders);
 state.tracking.records[batch.batchId]={...dispatched};ensureTrackingBatch(batch.batchId);write("hc_stable_tracking_records",state.tracking.records);

function verify(){
  const requested=String(state.verifyId||state.scannedBatch?.batchId||"").trim().toUpperCase();
  let batch=requested?state.batches[requested]:null;
  if(!batch && state.scannedBatch && String(state.scannedBatch.batchId||"").toUpperCase()===requested) batch={...state.scannedBatch};
  // QR payloads are self-contained, so customer devices can verify even when the batch was created on another browser.
  if(!batch && state.scannedBatch && !requested) batch={...state.scannedBatch};
  if(!batch){
    state.verified=null;
    state.batchMsg="Batch ID not found. Scan a registered HoneyChain QR code or enter a valid Batch ID.";
    setScannerMessage("Batch not found.","error");
    render();
    return;
  }
  state.verifyId=requested||String(batch.batchId||"").toUpperCase();
  state.verified={...batch,batchId:String(batch.batchId||requested).trim().toUpperCase()};
  state.scannedBatch=null;
  state.scannedCustomer=null;
  state.batchMsg="";
  if(state.user?.role==="customer") state.tracking.records[state.verified.batchId]={...state.verified};
  render();
  window.scrollTo({top:0,behavior:"smooth"});
}

function bytesToBase64Url(bytes){
  let binary=""; for(let i=0;i<bytes.length;i++) binary+=String.fromCharCode(bytes[i]);
  return btoa(binary).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/g,"");
}
function base64UrlToBytes(text){
  const b64=String(text||"").replace(/-/g,"+").replace(/_/g,"/");
  const padded=b64+"=".repeat((4-(b64.length%4))%4); const binary=atob(padded);
  const out=new Uint8Array(binary.length); for(let i=0;i<binary.length;i++) out[i]=binary.charCodeAt(i); return out;
}
function qrPayloadForBatch(b){
  const compact={
    b:b.batchId||"",hv:b.hiveId||"",hd:b.harvestDate||"",mf:b.manufactureDate||"",ex:b.expiryDate||"",
    lo:b.location||"",q:b.quantity||"",ht:b.honeyType||"",ql:b.quality||"",qp:b.qualityPurity||"",qm:b.qualityMoisture||"",
    qc:b.qualityColour||"",qs:b.qualityStatus||"",cn:b.customerName||"",cc:b.countryCode||"+91",cp:b.customerPhone||"",
    ca:b.customerAddress||"",pk:Number(b.pricePerKg)||priceForHoney(b.honeyType),ta:Number(b.totalAmount)||((Number(b.quantity)||0)*priceForHoney(b.honeyType))
  };
  try{
    if(window.pako && typeof window.pako.deflate==="function") return "HC3|"+bytesToBase64Url(window.pako.deflate(JSON.stringify(compact)));
  }catch(e){}
  return "HC2|"+JSON.stringify(compact);
}

async function handleDecodedQr(decodedText){

   const row=e.target.closest(".batchrow"); if(row) row.classList.toggle("batch-selected-row",e.target.checked);
   const boxes=[...document.querySelectorAll("[data-select-batch]")];
   const selected=boxes.filter(b=>b.checked).length;
   const all=document.querySelector("[data-select-all-batches]");
   if(all){all.checked=boxes.length>0&&selected===boxes.length;all.indeterminate=selected>0&&selected<boxes.length;}
 }
 if(e.target&&e.target.matches("[data-select-all-batches]")){
   const checked=e.target.checked;
   document.querySelectorAll("[data-select-batch]").forEach(b=>{b.checked=checked; const row=b.closest(".batchrow"); if(row) row.classList.toggle("batch-selected-row",checked);});
 }
});
document.addEventListener("click",e=>{const row=e.target.closest("[data-dashboard-batch]");if(row && state.page==="dashboard" && !e.target.closest("input[type=checkbox]") && !e.target.closest("button")){e.preventDefault();selectDashboardBatch(row.dataset.dashboardBatch);return;}});
document.addEventListener("click",e=>{const row=e.target.closest("[data-batch]");if(row&&state.page!=="dashboard"&&!e.target.closest("button[data-action]")&&!e.target.closest("input[type=checkbox]")){state.verifyId=row.dataset.batch;nav("verify")}});
document.addEventListener("click",e=>{
  const btn=e.target.closest("[data-action]");
  if(!btn)return;
  const a=btn.dataset.action;
  if(a==="dashboard"){e.preventDefault();actions.dashboard();return}
  const arg=btn.dataset.trackBatch||undefined;
  if(a==="downloadCustomerInvoice"&&btn.dataset.orderId){e.preventDefault();actions.downloadCustomerInvoice(btn.dataset.orderId);return}
  if(a==="sendOrderWhatsApp"&&btn.dataset.orderId){e.preventDefault();actions.sendOrderWhatsApp(btn.dataset.orderId);return}
  if(a==="dispatchCustomerOrder"&&btn.dataset.orderId){e.preventDefault();actions.dispatchCustomerOrder(btn.dataset.orderId);return}
  if(a==="selectCustomerHoney"&&btn.dataset.honey){e.preventDefault();actions.selectCustomerHoney(btn.dataset.honey);return}
  if(a==="selectCustomerQty"&&btn.dataset.qty){e.preventDefault();actions.selectCustomerQty(Number(btn.dataset.qty));return}
  if(a==="selectDemoPayment"&&btn.dataset.pay){e.preventDefault();actions.selectDemoPayment(btn.dataset.pay);return}
  if(a==="selectOrderBatch"&&btn.dataset.orderId&&btn.dataset.batchId){e.preventDefault();actions.selectOrderBatch(btn.dataset.orderId,btn.dataset.batchId);return}
  if(a==="openTracking"){e.preventDefault();actions.openTracking(arg);return}
  if(a==="selectTrackingBatch"){e.preventDefault();actions.selectTrackingBatch(arg);return}
  if(a==="removeTrackingBatch"){e.preventDefault();e.stopPropagation();actions.removeTrackingBatch(arg);return}
  if(actions[a]){e.preventDefault();actions[a]();}
  if(a&&a.startsWith("step")){const n=Number(a.slice(4));if(n<state.step){state.step=n;render()}}
});
render();
})();
</script>
</body></html>
